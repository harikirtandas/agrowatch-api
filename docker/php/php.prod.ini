; php.ini de produccion. Lo copia docker/railway/app.Dockerfile; el de
; desarrollo (docker/php/php.ini) se queda para docker-compose.
;
; La diferencia que importa es display_errors: un aviso de PHP impreso en
; medio de una respuesta JSON filtra rutas del servidor y nombres de archivo,
; y ademas rompe el JSON para el cliente. En produccion los errores se
; registran, no se muestran: el detalle va al log del contenedor (stderr, que
; es donde Railway lo lee) y el cliente recibe el 500 generico que arma
; src/public/index.php con APP_DEBUG=0.

display_errors = Off
display_startup_errors = Off

; se sigue reportando TODO, pero al log, no a la respuesta.
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

date.timezone = America/Argentina/Buenos_Aires

memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M

; al reves que en desarrollo: el codigo esta horneado en la imagen y no cambia
; mientras el contenedor vive, asi que conviene cachear el bytecode.
opcache.enable = 1
