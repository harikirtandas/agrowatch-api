services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-app}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      APP_DEBUG: ${APP_DEBUG:-1}
      # Origen del servicio `web` (abajo). Es la unica URL que puede llamar a
      # esta API desde un navegador; una app movil no pasa por CORS y no le
      # afecta este valor. Si cambia WEB_PORT, hay que actualizar esto tambien.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8082}
      TOKEN_TTL_HORAS: ${TOKEN_TTL_HORAS:-2}
    depends_on:
      mysql:
        condition: service_healthy

  # Frontend estatico, desacoplado del backend a proposito: corre en su
  # propio contenedor y puerto (otro origen para el navegador), y solo se
  # comunica con `app` por HTTP via fetch (ver web/js/api.js). No comparte
  # proceso ni puerto con la API.
  #
  # Apache (no nginx): el hosting real de destino es PHP+Apache+MySQL, asi
  # que local tiene que honrar web/.htaccess (mod_rewrite) igual que
  # produccion. php -S ignora .htaccess, por eso no sirve para este caso.
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "${WEB_PORT:-8082}:80"
    volumes:
      - ./web:/var/www/html:ro
    depends_on:
      - app

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql

volumes:
  mysql-data:
