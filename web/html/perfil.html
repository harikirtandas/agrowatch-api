<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroWatchOut — Mi perfil</title>
  <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>

  <div class="aplicacion">

    <!-- Barra lateral (misma que el resto de la app) -->
    <aside class="barra-lateral">
      <span class="barra-lateral__logo"></span>

      <nav class="barra-lateral__nav">
        <a href="dashboard_mi_campo.html" class="barra-lateral__icono" data-vista="panel" aria-label="Panel" title="Panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
        </a>
        <a href="semaforo.html" class="barra-lateral__icono" data-vista="lotes" aria-label="Lotes" title="Semáforo de mis lotes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
        </a>
        <a href="perfil.html" class="barra-lateral__icono barra-lateral__icono--activo" data-vista="perfil" aria-label="Perfil" title="Mi perfil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M4.5 20c1.6-3.6 5-5 7.5-5s5.9 1.4 7.5 5"/></svg>
        </a>
      </nav>

      <a href="configuracion_de_campos.html" class="barra-lateral__avatar" aria-label="Agregar" title="Nuevo establecimiento">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </a>

      <button type="button" class="barra-lateral__icono barra-lateral__salir" data-cerrar-sesion aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </aside>

    <!-- Contenido principal -->
    <div class="contenido">

      <header class="encabezado-perfil">
        <div>
          <h1 class="encabezado-perfil__titulo">Mi perfil</h1>
          <p class="encabezado-perfil__subtitulo">Tus datos, tu establecimiento y las campañas</p>
        </div>
        <div class="encabezado-perfil__acciones">
        </div>
      </header>

      <div class="tarjeta-perfil">
        <h2 class="tarjeta-perfil__titulo">Mis datos</h2>
        <p class="tarjeta-perfil__subtitulo">Por ahora no se pueden editar desde la app</p>
        <div class="formulario-perfil__campos">
          <div class="campo">
            <label for="nombre" class="campo__etiqueta">Nombre</label>
            <input type="text" id="nombre" class="campo__entrada" readonly>
          </div>
          <div class="campo">
            <label for="apellido" class="campo__etiqueta">Apellido</label>
            <input type="text" id="apellido" class="campo__entrada" readonly>
          </div>
          <div class="campo">
            <label for="email" class="campo__etiqueta">Email</label>
            <input type="email" id="email" class="campo__entrada" readonly>
          </div>
        </div>
      </div>

      <div class="tarjeta-perfil">
        <h2 class="tarjeta-perfil__titulo">Establecimiento</h2>
        <p class="tarjeta-perfil__subtitulo">El mismo que está elegido en el panel</p>
        <form id="formEstablecimiento" class="formulario-perfil__campos">
          <div class="campo">
            <label for="selectorEstablecimientoPerfil" class="campo__etiqueta">Establecimiento</label>
            <select id="selectorEstablecimientoPerfil" class="campo__entrada"></select>
          </div>
          <div class="campo">
            <label for="establecimiento" class="campo__etiqueta">Nombre del establecimiento</label>
            <input type="text" id="establecimiento" class="campo__entrada" maxlength="100" required>
          </div>
          <div class="campo">
            <label for="provincia" class="campo__etiqueta">Provincia</label>
            <input type="text" id="provincia" class="campo__entrada" maxlength="60" required>
          </div>
          <div class="campo">
            <label for="localidad" class="campo__etiqueta">Localidad</label>
            <input type="text" id="localidad" class="campo__entrada" maxlength="100" required>
          </div>
          <div class="acciones-perfil">
            <button type="submit" class="boton boton--principal">Guardar cambios</button>
            <a id="editarLotes" class="enlace-perfil" href="configuracion_de_campos.html">Editar los lotes de este campo</a>
          </div>
        </form>
      </div>

      <div class="tarjeta-perfil">
        <h2 class="tarjeta-perfil__titulo">Campañas</h2>
        <p class="tarjeta-perfil__subtitulo">Son compartidas por todos los usuarios: cerrar o crear una afecta a todos</p>
        <ul id="listaCampanias" class="lista-campanias"></ul>
        <form id="formCampania" class="formulario-campania">
          <div class="campo">
            <label for="campaniaNombre" class="campo__etiqueta">Nombre</label>
            <input type="text" id="campaniaNombre" class="campo__entrada" maxlength="30" placeholder="Ej. 2027/28" required>
          </div>
          <div class="campo">
            <label for="campaniaInicio" class="campo__etiqueta">Inicio</label>
            <input type="date" id="campaniaInicio" class="campo__entrada" required>
          </div>
          <div class="campo">
            <label for="campaniaFin" class="campo__etiqueta">Fin</label>
            <input type="date" id="campaniaFin" class="campo__entrada" required>
          </div>
          <button type="submit" class="boton boton--principal">Crear campaña</button>
        </form>
      </div>

      <button type="button" class="boton boton--salir" data-cerrar-sesion>Cerrar sesión</button>

    </div>
  </div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/global.js"></script>
<script src="../js/perfil.js"></script>

</body>
</html>
