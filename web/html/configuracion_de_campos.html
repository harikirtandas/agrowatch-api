<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroWatchOut — Configurar establecimiento</title>
  <link rel="stylesheet" href="../css/configuracion_de_campos.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

  <div class="aplicacion">

    <!-- Barra lateral (misma que el dashboard) -->
    <aside class="barra-lateral">
      <span class="barra-lateral__logo"></span>

      <nav class="barra-lateral__nav">
        <a href="dashboard_mi_campo.html" class="barra-lateral__icono" data-vista="panel" aria-label="Panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
        </a>
        <a href="semaforo.html" class="barra-lateral__icono" data-vista="lotes" aria-label="Lotes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
        </a>
        <a href="perfil.html" class="barra-lateral__icono" data-vista="perfil" aria-label="Perfil">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M4.5 20c1.6-3.6 5-5 7.5-5s5.9 1.4 7.5 5"/></svg>
        </a>
      </nav>

      <a href="configuracion_de_campos.html" class="barra-lateral__avatar barra-lateral__avatar--activo" aria-label="Agregar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </a>

      <button type="button" class="barra-lateral__icono barra-lateral__salir" data-cerrar-sesion aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </aside>

    <!-- Contenido principal -->
    <div class="contenido">

      <a href="dashboard_mi_campo.html" class="enlace-volver">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Volver a mi campo
      </a>

      <header class="encabezado-config">
        <div>
          <h1 class="encabezado-config__titulo">Configurar establecimiento</h1>
          <p class="encabezado-config__subtitulo">Se usa la misma pantalla para campo propio o arrendado</p>
        </div>
        <div class="encabezado-config__acciones">
          <button class="encabezado-config__campana" aria-label="Notificaciones">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 14 6 10Z"/><path d="M10 18a2 2 0 0 0 4 0"/></svg>
          </button>
          <span class="encabezado-config__perfil" aria-hidden="true"></span>
        </div>
      </header>

      <div class="tarjeta-config">

        <form class="formulario-config">

          <div class="campos-establecimiento">
            <div class="campo">
              <label for="nombreEstablecimiento" class="campo__etiqueta">Nombre del establecimiento</label>
              <input type="text" id="nombreEstablecimiento" name="nombreEstablecimiento" class="campo__entrada" maxlength="100" placeholder="Ej. Las carmelitas">
            </div>
            <div class="campo">
              <label for="provincia" class="campo__etiqueta">Provincia</label>
              <input type="text" id="provincia" name="provincia" class="campo__entrada" maxlength="60" placeholder="Ej. Buenos Aires">
            </div>
            <div class="campo">
              <label for="localidad" class="campo__etiqueta">Localidad</label>
              <input type="text" id="localidad" name="localidad" class="campo__entrada" maxlength="100" placeholder="Ej. Tres Arroyos">
            </div>
            <div class="campo">
              <label for="ubicacion" class="campo__etiqueta">Ubica tu campo en el mapa</label>
              <div class="campo__con-icono">
                <input type="text" id="ubicacion" name="ubicacion" class="campo__entrada" placeholder="Seleccionar ubicación" readonly aria-expanded="false">
                <svg class="campo__icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.2 7-11.5a7 7 0 1 0-14 0C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.3"/></svg>
              </div>
            </div>
          </div>

          <div id="contenedorMapa" class="contenedor-mapa" hidden>
            <p id="ayudaMapa" class="ayuda-mapa">Hacé clic en el mapa para ubicar el establecimiento</p>
            <div id="mapaCampo" class="mapa-selector"></div>
          </div>
          

          <h2 class="tarjeta-config__subtitulo">Lotes / parcelas</h2>

          <table class="tabla-lotes">
            <thead>
              <tr>
                <th>Lote</th>
                <th>Ha totales</th>
                <th>Ha efectivas</th>
                <th>Ubicación</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="cuerpoLotes"></tbody>
          </table>

          <button type="button" class="enlace-agregar-lote">+ Agregar lote</button>

          <h2 class="tarjeta-config__subtitulo">Cultivos habituales</h2>

          <div class="chips-cultivos">
            <button type="button" class="chip chip--seleccionado" data-cultivo="trigo">
              <svg class="chip__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
              Trigo
            </button>
            <button type="button" class="chip chip--seleccionado" data-cultivo="cebada">
              <svg class="chip__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
              Cebada
            </button>
            <button type="button" class="chip" data-cultivo="girasol">
              <svg class="chip__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
              Girasol
            </button>
            <button type="button" class="chip" data-cultivo="soja">
              <svg class="chip__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
              Soja
            </button>
          </div>

          <button type="submit" class="boton boton--principal">Guardar campo</button>
          <button type="button" id="botonEliminarEstablecimiento" class="boton boton--peligro" hidden>Eliminar establecimiento</button>

        </form>

      </div>
    </div>
  </div>
  
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/global.js"></script>
<script src="../js/mapa.js"></script>
<script src="../js/configuracion.js"></script>
</body>
</html>
