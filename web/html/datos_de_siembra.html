<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroWatchOut — Datos de siembra</title>
<link rel="stylesheet" href="../css/datos_de_siembra.css">
</head>
<body>

<div class="aplicacion">

  <!-- Barra lateral (misma que el resto de la app) -->
  <aside class="barra-lateral">
    <span class="barra-lateral__logo"></span>

    <nav class="barra-lateral__nav">
      <a href="dashboard_mi_campo.html" class="barra-lateral__icono barra-lateral__icono--activo" data-vista="panel" aria-label="Panel" title="Panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
      </a>
      <a href="semaforo.html" class="barra-lateral__icono" data-vista="lotes" aria-label="Lotes" title="Semáforo de mis lotes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
      </a>
      <a href="perfil.html" class="barra-lateral__icono" data-vista="perfil" aria-label="Perfil" title="Mi perfil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.2"/><path d="M4.5 20c1.6-3.6 5-5 7.5-5s5.9 1.4 7.5 5"/></svg>
      </a>
    </nav>

    <a href="configuracion_de_campos.html" class="barra-lateral__avatar" aria-label="Agregar" title="Nuevo establecimiento">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </a>

    <button type="button" class="barra-lateral__icono barra-lateral__salir" data-cerrar-sesion aria-label="Cerrar sesión" title="Cerrar sesión">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </aside>

  <!-- Contenido principal -->
  <div class="contenido">

    <a href="dashboard_mi_campo.html" class="enlace-volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Volver a mi campo
    </a>

    <header class="encabezado-siembra">
      <div>
        <h1 class="encabezado-siembra__titulo">Datos de siembra</h1>
        <p class="encabezado-siembra__subtitulo">Cargá los datos del lote sembrado</p>
      </div>
      <div class="encabezado-siembra__acciones">
      </div>
    </header>

    <div class="tarjeta-siembra">
      <form class="formulario-siembra">

        <div class="formulario-siembra__fila">
          <div class="campo">
            <label for="campania" class="campo__etiqueta">Campaña</label>
            <select id="campania" class="campo__entrada" required></select>
          </div>
          <div class="campo">
            <label for="lote" class="campo__etiqueta">Lote / parcela</label>
            <select id="lote" class="campo__entrada" required></select>
          </div>
          <div class="campo">
            <label for="cultivo" class="campo__etiqueta">Cultivo</label>
            <select id="cultivo" class="campo__entrada" required></select>
          </div>
        </div>

        <div class="formulario-siembra__fila formulario-siembra__fila--dos">
          <div class="campo">
            <label for="fechaSiembra" class="campo__etiqueta">Fecha de siembra</label>
            <input type="date" id="fechaSiembra" class="campo__entrada" required>
          </div>
          <div class="campo">
            <label for="hectareasSembradas" class="campo__etiqueta">Hectáreas sembradas</label>
            <input type="number" id="hectareasSembradas" class="campo__entrada" min="0.01" step="0.01" placeholder="Ej. 85" required>
          </div>
        </div>

        <div class="formulario-siembra__fila formulario-siembra__fila--dos">
          <div class="campo">
            <label for="variedad" class="campo__etiqueta">Variedad (opcional)</label>
            <input type="text" id="variedad" class="campo__entrada" maxlength="60" placeholder="Ej. Baguette 620">
          </div>
          <div class="campo">
            <label for="rindeEsperado" class="campo__etiqueta">Rinde esperado (qq/ha)</label>
            <input type="number" id="rindeEsperado" class="campo__entrada" min="0.1" step="0.1" placeholder="Ej. 35" required>
          </div>
        </div>

        <h2 class="tarjeta-siembra__subtitulo">Costos</h2>

        <table class="tabla-costos">
          <thead>
            <tr>
              <th>Categoría</th>
              <th>Descripción</th>
              <th>Cantidad</th>
              <th>Unidad</th>
              <th>Precio unit.</th>
              <th>Moneda</th>
              <th>Fecha</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cuerpoCostos"></tbody>
        </table>

        <button type="button" class="enlace-agregar-costo">+ Agregar costo</button>

        <span id="estadoSincronizacion" class="estado-sincronizacion" hidden></span>

        <button type="submit" class="boton boton--principal">Comenzar proyección</button>

        <button type="button" id="botonEliminarSiembra" class="boton boton--peligro" hidden>Eliminar siembra</button>

      </form>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/global.js"></script>
<script src="../js/sincronizacion.js"></script>
<script src="../js/datos_siembra.js"></script>

</body>
</html>
