<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo-aw.svg">
  <title>AgroWatchOut — Semáforo</title>
  <link rel="stylesheet" href="../css/comun.css">
  <link rel="stylesheet" href="../css/semaforo.css?v=2">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

  <div class="aplicacion">


    <!-- Contenido principal -->
    <div class="contenido">

      <a href="dashboard_mi_campo.html" class="enlace-volver">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Volver a mis lotes
      </a>

      <header class="encabezado-lote">
        <div>
          <h1 class="encabezado-lote__titulo">Cargando...</h1>
          <p class="encabezado-lote__subtitulo"></p>
          <label id="cambioVista" class="cambio-siembra" hidden>
            <span id="etiquetaVista">Ver otra campaña:</span>
            <select id="selectorVista" class="cambio-siembra__select"></select>
          </label>
        </div>
        <div class="encabezado-lote__acciones">
        </div>
      </header>

      <div id="avisoSemaforo" class="aviso-semaforo" hidden></div>

      <div class="tarjeta-semaforo">

        <div class="semaforo-gauge">
          <svg viewBox="0 0 220 130" class="semaforo-gauge__svg">
            <path d="M 20 110 A 90 90 0 0 1 70 27" fill="none" stroke="#d1583f" stroke-width="18" stroke-linecap="round"/>
            <path d="M 70 27 A 90 90 0 0 1 150 27" fill="none" stroke="#e0a83c" stroke-width="18" stroke-linecap="round"/>
            <path d="M 150 27 A 90 90 0 0 1 200 110" fill="none" stroke="#4f9d63" stroke-width="18" stroke-linecap="round"/>
            <g id="agujaSemaforo" transform="rotate(-90 110 110)">
              <line x1="110" y1="110" x2="110" y2="34" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
            </g>
            <circle cx="110" cy="110" r="7" fill="#1a1a1a"/>
          </svg>

          <strong id="valorRentabilidad" class="semaforo-gauge__valor">-</strong>
          <span class="semaforo-gauge__etiqueta">Rentabilidad proyectada</span>
          <p id="estadoSemaforo" class="semaforo-gauge__estado"></p>

          <strong id="valorRinde" class="semaforo-gauge__valor semaforo-gauge__valor--secundario">-</strong>
          <span id="etiquetaSecundaria" class="semaforo-gauge__etiqueta">Rinde de indiferencia</span>
        </div>

        <div class="grafico-margen">
          <h2 class="grafico-margen__titulo">Números de la proyección</h2>
          <dl class="detalle-margen">
            <div><dt>Ingreso esperado</dt><dd id="detIngreso">-</dd></div>
            <div><dt>Costo total</dt><dd id="detCosto">-</dd></div>
            <div><dt>Costo por hectárea</dt><dd id="detCostoHa">-</dd></div>
            <div><dt>Margen bruto</dt><dd id="detMargen">-</dd></div>
            <div><dt id="etiquetaPrecio">Precio usado</dt><dd id="detPrecio">-</dd></div>
            <div><dt>Dólar oficial</dt><dd id="detDolar">-</dd></div>
          </dl>
          <a id="editarSiembra" class="enlace-editar-siembra" href="dashboard_mi_campo.html">Editar siembra y costos</a>
          <a id="otraSiembra" class="enlace-editar-siembra enlace-otra-siembra" href="dashboard_mi_campo.html">+ Cargar otra siembra en este lote</a>
        </div>
      </div>

    </div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/global.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/modales.js?v=2"></script>
<script src="../js/mapa.js"></script>
<script src="../js/semaforo.js?v=3"></script>

</body>
</html>
