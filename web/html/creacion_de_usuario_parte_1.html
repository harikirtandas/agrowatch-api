<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo-aw.svg">
  <title>AgroWatchOut — Creación de usuario (Paso 1)</title>
  <link rel="stylesheet" href="../css/creacion_de_usuario_partes.css">
</head>

<body>

  <main class="pagina-registro">
    <div class="tarjeta-registro">

      <h1 class="tarjeta-registro__titulo">Creación de usuario</h1>

      <div class="progreso">
        <span class="progreso__punto progreso__punto--activo"></span>
        <span class="progreso__linea progreso__linea--activa"></span>
        <span class="progreso__etiqueta">Paso 1 de 2 · Tus datos</span>
        <span class="progreso__linea"></span>
        <span class="progreso__punto"></span>
      </div>

      <form class="formulario-registro">

        <div class="formulario-registro__fila">
          <div class="campo">
            <label for="nombre" class="campo__etiqueta">Nombre</label>
            <input type="text" id="nombre" name="nombre" class="campo__entrada" maxlength="60" required>
          </div>
          <div class="campo">
            <label for="apellido" class="campo__etiqueta">Apellido</label>
            <input type="text" id="apellido" name="apellido" class="campo__entrada" maxlength="60" required>
          </div>
        </div>

        <div class="formulario-registro__fila">
          <div class="campo">
            <label for="email" class="campo__etiqueta">Email</label>
            <input type="email" id="email" name="email" class="campo__entrada" maxlength="120" required>
          </div>
          <div class="campo">
            <label for="contrasena" class="campo__etiqueta">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" class="campo__entrada" minlength="6" maxlength="72" required>
          </div>
        </div>

        <button type="submit" class="boton boton--principal">Siguiente</button>

      </form>

      <p class="tarjeta-registro__nota">¿Ya tenés cuenta? 
        <a href="login.html">Iniciá sesión</a>
      </p>

    </div>
  </main>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/global.js"></script>
<script src="../js/registro_parte_1.js"></script>
</body>
</html>
