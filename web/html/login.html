<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../img/logo-aw.svg">
  <title>AgroWatchOut — Inicio de sesión</title>
  <link rel="stylesheet" href="../css/login.css">
</head>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/global.js"></script>
<script src="../js/login.js"></script>

<body>

  <main class="pagina-login">
    <div class="tarjeta-login">

      <h1 class="tarjeta-login__titulo">Inicio de sesión</h1>

      <form class="formulario-login">
        <div class="campo">
          <label for="usuario" class="campo__etiqueta">Usuario / Email</label>
          <input type="text" id="usuario" name="usuario" class="campo__entrada" placeholder="nombre@ejemplo.com">
        </div>

        <div class="campo">
          <label for="contrasena" class="campo__etiqueta">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" class="campo__entrada" placeholder="••••••••">
        </div>

        <button type="submit" class="boton boton--principal">Ingresar</button>
      </form>

      <a href="creacion_de_usuario_parte_1.html" class="enlace">¿Sos nuevo? Crear usuario</a>

      <a href="landing.html" class="enlace enlace--secundario">← Volver al inicio</a>

    </div>
  </main>

</body>
</html>
