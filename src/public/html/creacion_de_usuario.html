<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroWatchOut — Creación de usuario</title>
  <link rel="stylesheet" href="../css/creacion_de_usuario.css">
</head>
<body>

  <main class="pagina-registro">
    <div class="tarjeta-registro">

      <h1 class="tarjeta-registro__titulo">Creación de usuario</h1>

      <!-- method="POST" evita que los datos del formulario viajen en la URL -->
      <form class="formulario-registro" method="POST">

        <div class="formulario-registro__fila">
          <div class="campo">
            <label for="nombre" class="campo__etiqueta">Nombre</label>
            <input type="text" id="nombre" name="nombre" class="campo__entrada" required>
          </div>
          <div class="campo">
            <label for="apellido" class="campo__etiqueta">Apellido</label>
            <input type="text" id="apellido" name="apellido" class="campo__entrada" required>
          </div>
        </div>

        <div class="formulario-registro__fila">
          <div class="campo">
            <label for="email" class="campo__etiqueta">Email</label>
            <input type="email" id="email" name="email" class="campo__entrada" required>
          </div>
          <div class="campo">
            <label for="contrasena" class="campo__etiqueta">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" class="campo__entrada" required>
          </div>
        </div>

        <div class="formulario-registro__fila">
          <div class="campo">
            <label for="establecimiento" class="campo__etiqueta">Nombre del establecimiento</label>
            <input type="text" id="establecimiento" name="establecimiento" class="campo__entrada">
          </div>
          <div class="campo">
            <label for="provincia" class="campo__etiqueta">Provincia</label>
            <input type="text" id="provincia" name="provincia" class="campo__entrada">
          </div>
        </div>

        <div class="campo campo--ancho-completo">
          <label for="localidad" class="campo__etiqueta">Localidad</label>
          <input type="text" id="localidad" name="localidad" class="campo__entrada">
        </div>

        <button type="submit" class="boton boton--principal">Crear cuenta</button>

      </form>

    </div>
  </main>

</body>
</html>
